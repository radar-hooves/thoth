name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (all backends: Whisper Metal + Parakeet + FluidAudio Neural Engine)
          # macos-15 required for Swift 6.0+ (FluidAudio dependency)
          - platform: macos-15
            args: '--target aarch64-apple-darwin'
            rustflags: ''
          # Linux x86_64 (Whisper with Vulkan GPU acceleration; Parakeet excluded —
          # it now links statically (the old sherpa-rs no-static-archive blocker is
          # gone) but a Parakeet transcription is not yet runtime-verified on a glibc
          # desktop and crashes at model init under the Nix toolchain (#53); FluidAudio
          # is macOS-only). Vulkan is vendor-neutral (NVIDIA/AMD/Intel via the GPU's
          # Vulkan ICD), so one build serves every GPU; whisper.cpp falls back to
          # CPU at runtime when no Vulkan device is present.
          - platform: ubuntu-22.04
            args: '-- --no-default-features --features vulkan'
            rustflags: ''

    # by-exception (2026-07-03): release builds require native platform
    # toolchains — macOS codesigning/Metal/Swift (FluidAudio) and Linux
    # Vulkan/Wayland — which the household self-hosted runner cannot provide.
    runs-on: ${{ matrix.platform }}

    # Hard ceiling on the whole job — see the same note in ci.yaml. A release
    # bundles as well as compiles, so this is more generous than CI's 60.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # Reads the packageManager pin from package.json rather than
          # floating to whatever latest pnpm 10.x exists at run time.
          package_json_file: package.json

      - name: Setup Node.js
        # pnpm must already be on PATH before this step: setup-node's
        # package-manager-cache auto-detection reads the packageManager
        # field above and shells out to the pnpm binary to resolve the
        # store path, even though this job caches pnpm's store manually
        # below rather than via setup-node's own cache input.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Shared with ci.yaml — see scripts/install-linux-ci-deps.sh for why the
      # Vulkan SDK is needed and why every network call there is bounded and
      # retried. This ceiling is only a backstop for a stall the script does
      # not anticipate.
      - name: Install Linux CI dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 30
        run: ./scripts/install-linux-ci-deps.sh

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # GGML_NATIVE=OFF stops GGML's -march=native from re-enabling the i8mm
          # CPU feature on Apple Silicon and overriding the armv8 baseline below;
          # without it the -march flags alone are insufficient and the build
          # fails on vmmlaq_s32 (i8mm) intrinsics.
          GGML_NATIVE: ${{ matrix.platform == 'macos-15' && 'OFF' || '' }}
          CFLAGS: ${{ matrix.platform == 'macos-15' && '-march=armv8-a' || '' }}
          CXXFLAGS: ${{ matrix.platform == 'macos-15' && '-march=armv8-a' || '' }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        with:
          tagName: v__VERSION__
          releaseName: 'Thoth v__VERSION__'
          releaseBody: 'See the assets below to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Notify failure (ntfy infra)
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Inline ntfy notify: radar-hooves/master-project is a private repo, so
          # its composite action cannot be resolved at job-setup time from any
          # caller, Thoth's own vendor-hosted runners included (the reason is
          # master-project's visibility, not Thoth's — Thoth is public). Token
          # from NTFY_TOKEN secret.
          curl -sS --max-time 10 \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: thoth: release (${{ matrix.platform }}) failed" \
            -H "Priority: 4" \
            -H "Tags: rotating_light" \
            -d "Run: $RUN_URL" \
            "https://ntfy.godswood.au/infra" \
            || echo "::warning::ntfy notify POST failed"
