name: Nix

# Two-tier Nix gate (issue #117).
#
# Nothing else in CI evaluates flake.nix, so packaging breakage — a stale
# pnpmDeps hash, a flake output that no longer evaluates, a NixOS module that
# stopped instantiating — only ever surfaced when somebody ran `nix build` by
# hand. But a full `nix build` compiles the whole Rust tree plus whisper.cpp
# and pulls the CUDA sherpa-onnx prebuilt, which is far too slow to run on
# every PR that touches a Svelte component.
#
# So it is split:
#
#   Tier 1 (eval)  — runs on every PR. Evaluation only, plus a build of the
#                    pnpm dependency derivation. Cheap.
#   Tier 2 (build) — full `nix build`. Runs only when a file that changes how
#                    the package is *built* has changed.
#
# Tier 1 deliberately realises `.#thoth.pnpmDeps` rather than only evaluating.
# That derivation is fixed-output, so its hash is only verified when it is
# actually built, and it is the single most drift-prone value in the repo.
# Evaluation alone would not catch it. It costs seconds.
#
# It used to have to be "refreshed by hand whenever pnpm-lock.yaml changes",
# which made every Renovate PR fail on arrival: a bot cannot run Nix, so each
# dependency update sat red until a human regenerated the hash. Tier 1 now
# regenerates it instead of merely reporting it stale, and pushes the
# correction to the PR branch. See scripts/update-pnpm-deps-hash.sh.
#
# `main` is verify-only: a stale hash there fails the job rather than being
# silently rewritten, because on main it means something bypassed a PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Flake eval
    runs-on: ubuntu-22.04 # by-exception (2026-09-08): install-nix-action cannot install Nix on the NixOS runner
    timeout-minutes: 20

    # Needed to push the regenerated pnpmDeps hash back to a PR branch.
    permissions:
      contents: write

    outputs:
      packaging-changed: ${{ steps.filter.outputs.packaging }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the tier-2 path filter below can diff against the
          # base commit; the default shallow clone has no merge base.
          fetch-depth: 0
          # Check out the PR branch head rather than the merge ref, so the
          # hash-refresh step below has a real branch to commit onto. On push
          # and workflow_dispatch this falls through to the default.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Decides whether tier 2 runs. Deliberately scoped to files that change
      # how the package is BUILT (packaging inputs, lockfiles, manifests) —
      # not to src-tauri/**, whose compilation is already gated by ci.yaml's
      # Rust job. Including application source here would make the expensive
      # build run on nearly every PR and defeat the tiering.
      - name: Detect packaging changes
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # workflow_dispatch has no diff base, and a first push to a branch
          # reports an all-zero "before" SHA. Build in both cases rather than
          # silently skipping the expensive tier.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$BASE_SHA" ] \
            || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            echo "No usable diff base (${{ github.event_name }}); running the full build."
            exit 0
          fi

          # HEAD, not github.sha: the checkout above pins the PR branch head,
          # and the merge commit github.sha names is not fetched.
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"
          while IFS= read -r file; do
            echo "  $file"
          done <<< "$changed"

          if echo "$changed" | grep -qE '^(flake\.nix|flake\.lock|package\.json|pnpm-lock\.yaml|nix/|src-tauri/Cargo\.(toml|lock)|\.github/workflows/nix-check\.yaml)'; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            echo "Packaging-relevant change detected; the full build will run."
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
            echo "No packaging-relevant change; skipping the full build."
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Evaluates every flake output: packages, devShells, and any `checks`
      # (which is where the NixOS/home-manager module instantiation tests
      # live). --no-build keeps this to evaluation, which is the whole point
      # of the fast tier — for a module check, evaluating the configuration
      # IS the assertion.
      - name: Flake check (evaluation only)
        run: nix flake check --no-build --show-trace

      # Realises pnpmDeps, which is what actually verifies the fixed-output
      # hash, and repairs it in place rather than just reporting it stale.
      - name: Refresh the pnpmDeps hash
        id: pnpm_hash
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          SCRIPT="scripts/update-pnpm-deps-hash.sh"

          # On a PR, always run the BASE branch's copy of the script, never the
          # one at the PR head. Two reasons, both real:
          #   1. A branch opened before the script existed does not have it, and
          #      the step died with "No such file or directory" (hit on #162).
          #   2. This step runs with contents: write. A PR must not be able to
          #      edit the script that then pushes to its own branch.
          # Written into scripts/ rather than /tmp on purpose. Older copies of
          # the script derive the repo root from their own path, so running one
          # from a temp directory made it look for flake.nix in the wrong place.
          # Extracting it beside its normal home keeps that resolution correct
          # whichever version of the script the base branch carries.
          if [ "$IS_PR" = "true" ]; then
            SCRIPT="scripts/.ci-update-pnpm-deps-hash.sh"
            git show "${BASE_SHA}:scripts/update-pnpm-deps-hash.sh" > "$SCRIPT"
            chmod +x "$SCRIPT"
            trap 'rm -f "scripts/.ci-update-pnpm-deps-hash.sh"' EXIT
          fi

          if [ "$IS_PR" != "true" ]; then
            # main and workflow_dispatch: verify only. A stale hash here is a
            # signal that something skipped a PR, not something to paper over.
            "$SCRIPT" --check
            exit 0
          fi

          if "$SCRIPT" --check; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FROM_FORK" = "true" ]; then
            echo "::error::pnpmDeps hash is stale and this PR is from a fork, so CI has no write access to push the fix. Run scripts/update-pnpm-deps-hash.sh and commit the result."
            exit 1
          fi

          "$SCRIPT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit the refreshed hash
        if: steps.pnpm_hash.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit \
            -m "chore(nix): refresh pnpmDeps hash for the updated lockfile" \
            -m "pnpm-lock.yaml changed, which invalidates the fixed-output hash of the pnpm dependency derivation. Regenerated by CI so a bot-authored dependency update does not need a human to unblock it."
          git push origin "HEAD:${BRANCH}"

          # A push made with GITHUB_TOKEN does not start a new workflow run, so
          # this run is the one that reports status. The branch is correct as of
          # this push, and nothing else in this run depends on the hash.
          echo "::notice::pnpmDeps hash was stale and has been corrected on ${BRANCH}."

  build:
    name: Flake build
    needs: eval
    if: needs.eval.outputs.packaging-changed == 'true'
    runs-on: ubuntu-22.04 # by-exception (2026-09-08): install-nix-action cannot install Nix on the NixOS runner

    # Generous, because a cold build compiles the Rust tree and whisper.cpp
    # from scratch — but still a ceiling, so a stalled fetch cannot sit for
    # GitHub's default six hours (see the note in ci.yaml).
    timeout-minutes: 120

    steps:
      # The runner ships ~25GB of preinstalled toolchains this build never
      # uses, and the CUDA sherpa-onnx prebuilt plus a full Rust target dir
      # will otherwise run the disk out.
      - name: Free disk space
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free disk: ${before}G -> ${after}G"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build the package
        run: nix build .#thoth --no-link --print-build-logs
