name: CI

# Build, lint, and test gate on every PR and push to main. Without this, the
# only workflow that compiles the code is release.yaml (tag-triggered), so a
# change that breaks the Linux build — for example the Linux-only Wayland
# portal, x11rb, or GPU-feature paths, none of which compile on a macOS dev
# machine — would not surface until a release was cut. This job compiles the
# Linux target with the same feature set the release uses, so Linux breakage is
# caught at PR time.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: the primary target. Default features (Whisper Metal +
          # Parakeet + FluidAudio), so the macOS-only modules are compiled.
          - platform: macos-15
            args: ''
          # Linux: the same feature set release.yaml ships — defaults off,
          # Vulkan on. This compiles the Linux-only code (Wayland portal via
          # ashpd, x11rb mouse tracking, the Vulkan whisper backend) that never
          # builds on a macOS dev machine. Parakeet/FluidAudio are excluded as
          # in the release build: Parakeet now links statically on Linux (the old
          # sherpa-rs blocker is gone) but a Parakeet transcription is not yet
          # runtime-verified on a glibc desktop and crashes at model init under
          # the Nix toolchain — opt in with `--features parakeet` to test (#53).
          - platform: ubuntu-22.04
            args: '--no-default-features --features vulkan'

    # by-exception (2026-07-03): cross-platform compilation gate — macOS
    # Metal/Swift toolchain and Linux Vulkan/Wayland code cannot build on the
    # household self-hosted runner (atlas is macOS-only); both platforms must
    # be tested natively.
    runs-on: ${{ matrix.platform }}

    # Hard ceiling on the whole job. GitHub's default is 6 hours, which is long
    # enough that a stalled step reads as "still building" — on 2026-08-18 a hung
    # apt fetch ran 3.5 hours unnoticed. A cold-cache Linux build is ~33 minutes,
    # so 60 left headroom — but bounded apt retries can legitimately add ~15
    # minutes on a bad mirror day, so 75 keeps that from tripping the ceiling.
    timeout-minutes: 75

    # macOS Apple Silicon runners: whisper.cpp's GGML detects the i8mm CPU
    # feature via -march=native and emits vmmlaq_s32 intrinsics, then fails to
    # compile because the target feature isn't enabled for the function being
    # inlined into. GGML_NATIVE=OFF stops GGML overriding our -march, and the
    # explicit armv8 baseline keeps the i8mm intrinsics out. Empty on Linux.
    env:
      GGML_NATIVE: ${{ matrix.platform == 'macos-15' && 'OFF' || '' }}
      CFLAGS: ${{ matrix.platform == 'macos-15' && '-march=armv8-a' || '' }}
      CXXFLAGS: ${{ matrix.platform == 'macos-15' && '-march=armv8-a' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runs before the build so a drift regression fails in seconds rather
      # than after a 30-minute compile.
      - name: Guard shared build scripts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: ./scripts/test-linux-build-scripts.sh

      # The setup lives in scripts/install-linux-ci-deps.sh so this and
      # release.yaml share one definition instead of copies that drift.
      #
      # The script bounds and retries every network operation itself, which is
      # what actually survives a bad mirror — apt's own Acquire timeouts do
      # not, because they bound individual socket operations rather than the
      # invocation (a stalled mirror sat here for 24.5 minutes on 2026-08-19
      # with those options set). This ceiling is only a backstop for a stall
      # the script does not anticipate, so it is generous by design; policing
      # slowness with it is what broke the build on 2026-08-18.
      - name: Install Linux CI dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 30
        run: ./scripts/install-linux-ci-deps.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check formatting
        working-directory: ./src-tauri
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        working-directory: ./src-tauri
        run: cargo clippy --all-targets ${{ matrix.args }} -- -D warnings

      - name: Test
        working-directory: ./src-tauri
        run: cargo test ${{ matrix.args }}

      - name: Validate desktop entry (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: desktop-file-validate src-tauri/linux/thoth.desktop

  frontend:
    name: Frontend
    # by-exception (2026-09-28): public repo takes fork PRs; fork code must not run on the household runner
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","atlas"]') }}

    # Tighter than the rust job's ceiling: this one takes ~1.5 minutes, and it
    # runs on the self-hosted box, where a hung job holds the runner hostage
    # rather than just burning hosted minutes.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # Reads the packageManager pin from package.json rather than
          # floating to whatever latest pnpm 10.x exists at run time.
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          # pnpm must already be on PATH before this step: setup-node's
          # package-manager-cache auto-detection reads the packageManager
          # field above and shells out to the pnpm binary to resolve the
          # store path.
          cache: 'pnpm'
          # No registry-url/scope: @poodle64/design-tokens and @poodle64/ui are
          # public on registry.npmjs.org, so the default registry serves them with
          # no credential. Setting registry-url here writes an .npmrc pointing the
          # scope at GitHub Packages, which then 404s every published version
          # (2026-08-14).

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (svelte-check)
        run: pnpm check

      - name: CSS lint (stylelint)
        run: pnpm lint:css

      - name: Design-system drift
        run: pnpm lint:drift

      - name: Design craft
        run: pnpm lint:design

      - name: Unit tests (vitest)
        run: pnpm test:run

      - name: Production build
        run: pnpm build
